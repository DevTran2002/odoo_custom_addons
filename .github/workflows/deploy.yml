# Tệp cấu hình luồng CI/CD tự động chạy trên máy cục bộ (Self-Hosted Runner)
name: Deploy Custom Addons Local CI/CD

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy-addons:
    runs-on: self-hosted
    steps:
      # Bước 1: Lấy mã nguồn mới nhất từ GitHub về máy
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      # Bước 2: Khởi chạy lại Docker Container Odoo trên máy local
      - name: Khởi chạy lại Docker Container Odoo
        shell: powershell
        run: |
          Set-Location -Path "d:\odoo_16CE\docker"
          docker compose restart odoo_sambala
