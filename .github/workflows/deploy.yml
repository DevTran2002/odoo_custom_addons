# Tệp cấu hình luồng CI/CD tự động chạy khi merge vào nhánh production
name: Deploy Custom Addons Production CI/CD

on:
  push:
    branches:
      - production

jobs:
  deploy-addons:
    runs-on: self-hosted
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Khởi chạy lại Docker Container Odoo
        shell: powershell
        run: |
          Set-Location -Path "d:\odoo_16CE\docker"
          docker compose restart odoo_sambala
